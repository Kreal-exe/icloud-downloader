# Builds iCloud Downloader (the desktop app) for Windows and macOS and publishes a GitHub release.
# Runs on a tag app-vX.Y.Z (the version in app/iCloudDownloader.csproj), or by hand.
name: iCloud Downloader release

on:
  push:
    tags:
      - 'app-v*'
  workflow_dispatch:

permissions:
  contents: write

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: 1

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Engine (one executable)
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check . pyinstaller
          python -m PyInstaller --onefile --name icdl-engine --paths src --collect-submodules keyring --collect-data tzdata --noconfirm src/icdl_engine.py
      - name: Window
        shell: pwsh
        run: |
          dotnet publish app/iCloudDownloader.csproj -c Release -r win-x64 --self-contained true -o out `
            -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -p:DebugType=none
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force pkg/iCloudDownloader/engine | Out-Null
          Copy-Item out/iCloudDownloader.exe pkg/iCloudDownloader/
          Copy-Item dist/icdl-engine.exe pkg/iCloudDownloader/engine/
          Compress-Archive -Path pkg/iCloudDownloader -DestinationPath iCloudDownloader-Windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: iCloudDownloader-Windows-x64.zip

  macos:
    # After the release exists: a busy macOS runner pool must not hold back the Windows download.
    needs: [release]
    runs-on: macos-latest   # Apple Silicon
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Engine (one executable)
        run: |
          python -m pip install --disable-pip-version-check . pyinstaller
          python -m PyInstaller --onefile --name icdl-engine --paths src --collect-submodules keyring --collect-data tzdata --noconfirm src/icdl_engine.py
      - name: App bundle
        run: |
          APP=iCloudDownloader.app
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources/engine"
          dotnet publish app/iCloudDownloader.csproj -c Release -r osx-arm64 --self-contained true \
            -o "$APP/Contents/MacOS" -p:DebugType=none -p:UseAppHost=true
          cp dist/icdl-engine "$APP/Contents/Resources/engine/"
          chmod +x "$APP/Contents/Resources/engine/icdl-engine" "$APP/Contents/MacOS/iCloudDownloader"
          ICONSET=icon.iconset; mkdir -p $ICONSET
          for s in 16 32 128 256 512; do
            sips -z $s $s app/Assets/icon.png --out "$ICONSET/icon_${s}x${s}.png" >/dev/null
            sips -z $((s*2)) $((s*2)) app/Assets/icon.png --out "$ICONSET/icon_${s}x${s}@2x.png" >/dev/null
          done
          iconutil -c icns $ICONSET -o "$APP/Contents/Resources/icon.icns"
          VERSION="$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' app/iCloudDownloader.csproj | head -1)"
          cat > "$APP/Contents/Info.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>CFBundleName</key><string>iCloud Downloader</string>
            <key>CFBundleDisplayName</key><string>iCloud Downloader</string>
            <key>CFBundleIdentifier</key><string>io.github.kreal-exe.icloud-downloader</string>
            <key>CFBundleExecutable</key><string>iCloudDownloader</string>
            <key>CFBundleIconFile</key><string>icon</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>${VERSION}</string>
            <key>CFBundleVersion</key><string>${VERSION}</string>
            <key>LSMinimumSystemVersion</key><string>12.0</string>
            <key>NSHighResolutionCapable</key><true/>
          </dict></plist>
          PLIST
          codesign --force --deep --sign - "$APP"
          ditto -c -k --keepParent "$APP" iCloudDownloader-macOS-arm64.zip
      - name: Add to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' app/iCloudDownloader.csproj | head -1)"
          TAG="${GITHUB_REF_NAME}"
          [[ "$TAG" == app-v* ]] || TAG="app-v$VERSION"
          gh release upload "$TAG" iCloudDownloader-macOS-arm64.zip --clobber

  release:
    needs: [windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' app/iCloudDownloader.csproj | head -1)"
          TAG="${GITHUB_REF_NAME}"
          [[ "$TAG" == app-v* ]] || TAG="app-v$VERSION"
          cat > notes.md <<NOTES
          **iCloud Downloader $VERSION** — download your whole iCloud Photos library to a folder, resume where it stopped, see what is happening.

          | | Download | How to run |
          |---|---|---|
          | Windows 10/11 (x64) | \`iCloudDownloader-Windows-x64.zip\` | Unzip and run \`iCloudDownloader.exe\` (keep the \`engine\` folder next to it). |
          | macOS 12+ (Apple Silicon) | \`iCloudDownloader-macOS-arm64.zip\` | Unzip, move to Applications. The app is not notarized: the first time, right-click → Open. |

          Nothing else to install. See the [README](https://github.com/${GITHUB_REPOSITORY}#readme).
          NOTES
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" iCloudDownloader-*.zip --clobber
          else
            gh release create "$TAG" iCloudDownloader-*.zip --title "iCloud Downloader $VERSION" --notes-file notes.md --target "$GITHUB_SHA"
          fi
